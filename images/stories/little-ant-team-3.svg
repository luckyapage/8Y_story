<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>螞蟻們抬著餅乾走過葉子橋，然後在大香菇下面躲雨。</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b8cc"/>
      <stop offset="1" stop-color="#d7e1ec"/>
    </linearGradient>
    <g id="ant">
      <g stroke="#3a2a22" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path d="M-14 6l-5 11M-2 4v13M6 4l6 12"/>
        <path d="M13-13q-3-9-9-12M18-12q3-10 10-11"/>
      </g>
      <circle cx="4" cy="-25" r="2.2"/>
      <circle cx="28" cy="-23" r="2.2"/>
      <ellipse cx="-14" cy="0" rx="12" ry="9"/>
      <circle cx="0" cy="-1" r="6"/>
      <circle cx="13" cy="-5" r="10"/>
      <circle cx="16" cy="-8" r="3.4" fill="#fff"/>
      <circle cx="17" cy="-8" r="1.8" fill="#222"/>
      <circle cx="19" cy="-2" r="2.2" fill="#f7a1a1"/>
    </g>
    <g id="hei">
      <use href="#ant" fill="#2d2a32"/>
      <path d="M2-6q6 7 12 2l2 4q-8 6-15 0z" fill="#e8504a"/>
      <path d="M4-1l-5 9 7-3z" fill="#e8504a"/>
    </g>
    <path id="drop" d="M0-7q5 7 0 10q-5-3 0-10z" fill="#6fb6e8"/>
  </defs>

  <!-- 陰天 -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <g fill="#8e9bb0">
    <ellipse cx="90" cy="40" rx="60" ry="22"/>
    <ellipse cx="130" cy="28" rx="36" ry="20"/>
    <ellipse cx="300" cy="35" rx="70" ry="24"/>
    <ellipse cx="340" cy="22" rx="36" ry="18"/>
  </g>

  <!-- 草地 -->
  <path d="M0 175q100-15 200 0t200-5v130H0z" fill="#86c464"/>

  <!-- 小水溝 -->
  <path d="M60 300q20-60 0-125h70q20 65 0 125z" fill="#7cc4ee"/>
  <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M80 215q8-4 16 0M88 255q8-4 16 0"/>
  </g>

  <!-- 葉子橋 -->
  <path d="M40 206q55-26 120 0q-60 18-120 0z" fill="#4fae4a"/>
  <path d="M42 206h116" stroke="#2f8a34" stroke-width="2"/>

  <!-- 過橋的螞蟻抬餅乾 -->
  <g transform="translate(100 168)">
    <ellipse cx="0" cy="5" rx="42" ry="10" fill="#c9883f"/>
    <ellipse cx="0" cy="0" rx="42" ry="10" fill="#eebc72"/>
    <circle cx="-14" cy="-1" r="3" fill="#6b3f26"/>
    <circle cx="14" cy="2" r="3" fill="#6b3f26"/>
  </g>
  <g fill="#9c5a36">
    <use href="#ant" transform="translate(78 196) scale(0.8)"/>
    <use href="#ant" transform="translate(112 196) scale(0.8)"/>
  </g>
  <use href="#hei" transform="translate(150 194) scale(0.8)"/>

  <!-- 大香菇 -->
  <rect x="290" y="170" width="28" height="70" rx="12" fill="#fff4e2"/>
  <path d="M220 178q84-110 168 0z" fill="#e8504a"/>
  <g fill="#fff">
    <circle cx="265" cy="140" r="9"/>
    <circle cx="310" cy="118" r="11"/>
    <circle cx="350" cy="148" r="8"/>
  </g>

  <!-- 躲在香菇下的螞蟻 -->
  <g transform="translate(268 228)">
    <ellipse cx="0" cy="4" rx="30" ry="8" fill="#c9883f"/>
    <ellipse cx="0" cy="0" rx="30" ry="8" fill="#eebc72"/>
  </g>
  <g fill="#9c5a36">
    <use href="#ant" transform="translate(318 240) scale(0.7)"/>
    <use href="#ant" transform="translate(360 228) scale(-0.7 0.7)"/>
  </g>

  <!-- 雨滴 -->
  <g>
    <use href="#drop" x="30" y="70"/><use href="#drop" x="80" y="110"/>
    <use href="#drop" x="140" y="80"/><use href="#drop" x="190" y="120"/>
    <use href="#drop" x="220" y="70"/><use href="#drop" x="380" y="100"/>
    <use href="#drop" x="25" y="150"/><use href="#drop" x="180" y="160"/>
    <use href="#drop" x="200" y="230"/><use href="#drop" x="380" y="200"/>
    <use href="#drop" x="40" y="270"/><use href="#drop" x="170" y="275"/>
  </g>
</svg>
