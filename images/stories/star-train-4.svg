<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>天邊微微亮了，小女孩躺回床上蓋好被子，窗外的星星列車正要飛走。</title>
  <defs>
    <path id="star" d="M0,-20 L5.3,-7.3 L19,-6.2 L8.6,2.8 L11.8,16.2 L0,9 L-11.8,16.2 L-8.6,2.8 L-19,-6.2 L-5.3,-7.3 Z" fill="#ffd84d" stroke="#ffd84d" stroke-width="5" stroke-linejoin="round"/>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a78"/>
      <stop offset="0.6" stop-color="#9a8cc9"/>
      <stop offset="1" stop-color="#ffc7a8"/>
    </linearGradient>
  </defs>

  <!-- 房間牆壁與地板 -->
  <rect width="400" height="300" fill="#5d5294"/>
  <rect y="250" width="400" height="50" fill="#8a6f5a"/>

  <!-- 窗戶與天邊的晨光 -->
  <rect x="215" y="30" width="150" height="120" rx="8" fill="url(#dawn)"/>
  <circle cx="230" cy="140" r="10" fill="#ffe0a3"/>
  <g fill="#fff6c2">
    <circle cx="245" cy="55" r="1.5"/>
    <circle cx="300" cy="45" r="1.5"/>
  </g>
  <!-- 飛走的星星列車 -->
  <path d="M270,110 Q300,90 345,60" fill="none" stroke="#ffe680" stroke-width="3" stroke-linecap="round"/>
  <use href="#star" transform="translate(345,60) scale(0.7)"/>
  <use href="#star" transform="translate(318,80) scale(0.5)"/>
  <use href="#star" transform="translate(295,95) scale(0.5)"/>
  <use href="#star" transform="translate(272,108) scale(0.5)"/>
  <rect x="215" y="30" width="150" height="120" rx="8" fill="none" stroke="#3e3360" stroke-width="6"/>
  <path d="M290,30 L290,150 M215,90 L365,90" stroke="#3e3360" stroke-width="4" opacity="0.5"/>

  <!-- 床 -->
  <rect x="20" y="150" width="16" height="115" rx="6" fill="#c98b5a"/>
  <rect x="20" y="215" width="250" height="40" rx="8" fill="#c98b5a"/>
  <ellipse cx="80" cy="190" rx="40" ry="16" fill="#ffffff"/>

  <!-- 小晴躺在枕頭上 -->
  <g transform="translate(78,178)">
    <circle cx="-18" cy="-10" r="8" fill="#7a4a2a"/>
    <circle cx="18" cy="-10" r="8" fill="#7a4a2a"/>
    <circle cx="0" cy="0" r="17" fill="#ffd9b3"/>
    <path d="M-17,-2 Q-15,-20 0,-19 Q15,-20 17,-2 Q8,-12 -17,-2 Z" fill="#7a4a2a"/>
    <path d="M-9,2 Q-6,-2 -3,2" fill="none" stroke="#3b2a1e" stroke-width="2" stroke-linecap="round"/>
    <path d="M3,2 Q6,-2 9,2" fill="none" stroke="#3b2a1e" stroke-width="2" stroke-linecap="round"/>
    <path d="M-4,8 Q0,12 4,8" fill="none" stroke="#3b2a1e" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="-11" cy="7" r="2.8" fill="#ffaaa0"/>
    <circle cx="11" cy="7" r="2.8" fill="#ffaaa0"/>
  </g>

  <!-- 被子 -->
  <path d="M60,200 Q160,188 262,200 L262,228 Q160,236 60,228 Z" fill="#ff9ec7"/>
  <path d="M95,200 L95,230 M140,196 L140,232 M185,196 L185,232 M230,198 L230,230" stroke="#ffc2dc" stroke-width="3"/>
  <use href="#star" transform="translate(160,214) scale(0.35)"/>
  <use href="#star" transform="translate(210,214) scale(0.35)"/>
  <rect x="255" y="185" width="16" height="80" rx="6" fill="#c98b5a"/>
</svg>
