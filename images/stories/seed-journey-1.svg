  </g>
  <!-- 蒲公英媽媽 -->
  <path d="M170 250 Q160 190 168 120" stroke="#6fae4f" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M168 250 Q130 230 120 205 Q150 215 168 240 Z" fill="#6fae4f"/>
  <path d="M172 250 Q210 235 222 210 Q190 220 172 242 Z" fill="#6fae4f"/>
  <circle cx="168" cy="105" r="52" fill="#ffffff" opacity="0.85" stroke="#d3dce8" stroke-width="2"/>
  <g stroke="#d3dce8" stroke-width="2" stroke-linecap="round">
    <path d="M168 105 L168 58 M168 105 L208 80 M168 105 L214 120 M168 105 L196 146 M168 105 L140 146 M168 105 L122 120 M168 105 L128 80"/>
