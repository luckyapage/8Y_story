  <path d="M162 109 Q168 115 174 109" stroke="#3b2a1f" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="158" cy="108" r="2.5" fill="#f4a3a3"/>
  <circle cx="178" cy="108" r="2.5" fill="#f4a3a3"/>
