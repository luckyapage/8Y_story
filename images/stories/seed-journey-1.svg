  <use xlink:href="#seed" href="#seed" transform="translate(285 150) rotate(12)"/>
  <path d="M300 152 Q312 140 308 128" stroke="#b07a52" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
