<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>雨停了，太陽出來，螞蟻們在家門口圍著大餅乾開心地分享。</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3b8"/>
      <stop offset="1" stop-color="#fff6e6"/>
    </linearGradient>
    <g id="ant">
      <g stroke="#3a2a22" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path d="M-14 6l-5 11M-2 4v13M6 4l6 12"/>
        <path d="M13-13q-3-9-9-12M18-12q3-10 10-11"/>
      </g>
      <circle cx="4" cy="-25" r="2.2"/>
      <circle cx="28" cy="-23" r="2.2"/>
      <ellipse cx="-14" cy="0" rx="12" ry="9"/>
      <circle cx="0" cy="-1" r="6"/>
      <circle cx="13" cy="-5" r="10"/>
      <circle cx="16" cy="-8" r="3.4" fill="#fff"/>
      <circle cx="17" cy="-8" r="1.8" fill="#222"/>
      <circle cx="19" cy="-2" r="2.2" fill="#f7a1a1"/>
    </g>
    <g id="hei">
      <use href="#ant" fill="#2d2a32"/>
      <path d="M2-6q6 7 12 2l2 4q-8 6-15 0z" fill="#e8504a"/>
      <path d="M4-1l-5 9 7-3z" fill="#e8504a"/>
    </g>
  </defs>

  <!-- 雨後的天空與彩虹 -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <g fill="none" stroke-width="9" opacity="0.75">
    <path d="M40 190a160 150 0 0 1 320 0" stroke="#ff9a9a"/>
    <path d="M49 190a151 141 0 0 1 302 0" stroke="#ffd27a"/>
    <path d="M58 190a142 132 0 0 1 284 0" stroke="#a9e08c"/>
    <path d="M67 190a133 123 0 0 1 266 0" stroke="#8fcaf5"/>
  </g>
  <circle cx="345" cy="50" r="24" fill="#ffd95a"/>

  <!-- 草地 -->
  <path d="M0 185q100-18 200-2t200-6v123H0z" fill="#8fd16a"/>
  <path d="M0 250q130-15 240 0t160-4v54H0z" fill="#79c257"/>

  <!-- 螞蟻窩門口 -->
  <path d="M10 225q50-80 110 0z" fill="#c98f5a"/>
  <path d="M30 218q35-48 70 0z" fill="#d9a46d"/>
  <ellipse cx="65" cy="217" rx="15" ry="10" fill="#5a3a24"/>

  <!-- 大餅乾 -->
  <g transform="translate(225 235)">
    <ellipse cx="0" cy="8" rx="70" ry="18" fill="#c9883f"/>
    <ellipse cx="0" cy="0" rx="70" ry="18" fill="#eebc72"/>
    <g fill="#6b3f26">
      <ellipse cx="-36" cy="-2" rx="6" ry="2.6"/>
      <ellipse cx="0" cy="6" rx="6" ry="2.6"/>
      <ellipse cx="34" cy="-4" rx="6" ry="2.6"/>
    </g>
  </g>

  <!-- 螞蟻媽媽（粉紅蝴蝶結） -->
  <g transform="translate(130 238) scale(1.4)">
    <use href="#ant" fill="#7a4428"/>
    <path d="M10-16l-7-5v9zM10-16l7-5v9z" fill="#ff8fb8"/>
    <circle cx="10" cy="-16" r="2.5" fill="#ff6fa3"/>
  </g>

  <!-- 圍著餅乾的螞蟻們 -->
  <g fill="#9c5a36">
    <use href="#ant" transform="translate(180 210) scale(0.8)"/>
    <use href="#ant" transform="translate(272 210) scale(-0.8 0.8)"/>
    <use href="#ant" transform="translate(325 250) scale(-0.9 0.9)"/>
  </g>
  <use href="#hei" transform="translate(222 208) scale(0.9)"/>

  <!-- 開心的小愛心 -->
  <g fill="#ff7f9c">
    <path d="M200 160q-8-8-4-13q4-4 8 1q4-5 8-1q4 5-4 13l-4 4z"/>
    <path d="M300 170q-6-6-3-10q3-3 6 1q3-4 6-1q3 4-3 10l-3 3z"/>
  </g>
</svg>
