<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>夜晚的窗外停著一列由亮黃色星星組成的小火車，小女孩趴在窗邊驚喜地看著。</title>
  <defs>
    <path id="star" d="M0,-20 L5.3,-7.3 L19,-6.2 L8.6,2.8 L11.8,16.2 L0,9 L-11.8,16.2 L-8.6,2.8 L-19,-6.2 L-5.3,-7.3 Z" fill="#ffd84d" stroke="#ffd84d" stroke-width="5" stroke-linejoin="round"/>
    <g id="face">
      <circle cx="-6" cy="-1" r="2.2" fill="#5a3d1e"/>
      <circle cx="6" cy="-1" r="2.2" fill="#5a3d1e"/>
      <path d="M-4,5 Q0,9 4,5" fill="none" stroke="#5a3d1e" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-10" cy="4" r="2.2" fill="#ffab5c"/>
      <circle cx="10" cy="4" r="2.2" fill="#ffab5c"/>
    </g>
  </defs>

  <!-- 夜空 -->
  <rect width="400" height="300" fill="#1f2b5c"/>
  <g fill="#fff6c2">
    <circle cx="200" cy="30" r="2"/>
    <circle cx="260" cy="60" r="1.5"/>
    <circle cx="330" cy="25" r="2"/>
    <circle cx="380" cy="80" r="1.5"/>
    <circle cx="230" cy="250" r="1.5"/>
    <circle cx="350" cy="260" r="2"/>
    <circle cx="300" cy="100" r="1.5"/>
  </g>
  <path d="M365,40 a22,22 0 1,0 18,32 a17,17 0 1,1 -18,-32 Z" fill="#ffe680"/>

  <!-- 房子牆壁與窗戶 -->
  <rect x="0" y="0" width="150" height="300" fill="#6a5a8e"/>
  <rect x="25" y="85" width="105" height="115" rx="8" fill="#ffe9a8"/>
  <rect x="25" y="85" width="105" height="115" rx="8" fill="none" stroke="#3e3360" stroke-width="6"/>
  <rect x="18" y="198" width="119" height="10" rx="4" fill="#3e3360"/>

  <!-- 小晴趴在窗邊 -->
  <g transform="translate(78,165)">
    <circle cx="-17" cy="-20" r="8" fill="#7a4a2a"/>
    <circle cx="17" cy="-20" r="8" fill="#7a4a2a"/>
    <path d="M-22,33 Q-24,8 0,6 Q24,8 22,33 Z" fill="#ff9ec7"/>
    <circle cx="0" cy="-8" r="17" fill="#ffd9b3"/>
    <path d="M-17,-10 Q-15,-28 0,-27 Q15,-28 17,-10 Q8,-20 -17,-10 Z" fill="#7a4a2a"/>
    <circle cx="-6" cy="-6" r="2.4" fill="#3b2a1e"/>
    <circle cx="6" cy="-6" r="2.4" fill="#3b2a1e"/>
    <ellipse cx="0" cy="3" rx="3.5" ry="4" fill="#c0392b"/>
    <circle cx="-11" cy="1" r="2.8" fill="#ffaaa0"/>
    <circle cx="11" cy="1" r="2.8" fill="#ffaaa0"/>
    <ellipse cx="-14" cy="33" rx="7" ry="5" fill="#ffd9b3"/>
    <ellipse cx="14" cy="33" rx="7" ry="5" fill="#ffd9b3"/>
  </g>

  <!-- 星星列車 -->
  <path d="M370,200 Q385,215 395,200" fill="none" stroke="#fff6c2" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>
  <path d="M195,160 L355,190" stroke="#ffe680" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(200,158) scale(1.6)">
    <use href="#star"/>
    <use href="#face"/>
  </g>
  <g transform="translate(255,170) scale(1.15)">
    <use href="#star"/>
    <use href="#face"/>
  </g>
  <g transform="translate(305,180) scale(1.15)">
    <use href="#star"/>
    <use href="#face"/>
  </g>
  <g transform="translate(352,190) scale(1.15)">
    <use href="#star"/>
    <use href="#face"/>
  </g>
  <g fill="#fff6c2">
    <circle cx="190" cy="186" r="5"/>
    <circle cx="212" cy="186" r="5"/>
    <circle cx="255" cy="192" r="4"/>
    <circle cx="305" cy="202" r="4"/>
    <circle cx="352" cy="212" r="4"/>
  </g>
</svg>
