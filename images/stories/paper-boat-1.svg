<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>小男孩蹲在小河邊，河上的白色紙船張開圓圓的眼睛，一隻綠色小青蛙跳上船。</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <g id="boat">
      <path d="M-45,0 L45,0 L30,22 L-30,22 Z" fill="#ffffff" stroke="#9fb4c8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-22,0 L0,-38 L22,0 Z" fill="#f4f8fc" stroke="#9fb4c8" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="-12" cy="10" r="5" fill="#fff" stroke="#33415c" stroke-width="1.5"/>
      <circle cx="12" cy="10" r="5" fill="#fff" stroke="#33415c" stroke-width="1.5"/>
      <circle cx="-11" cy="11" r="2.5" fill="#33415c"/>
      <circle cx="13" cy="11" r="2.5" fill="#33415c"/>
      <path d="M-5,16 Q0,20 5,16" fill="none" stroke="#33415c" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="frog">
      <ellipse cx="0" cy="0" rx="16" ry="12" fill="#7cc95a"/>
      <circle cx="-8" cy="-10" r="6" fill="#7cc95a"/>
      <circle cx="8" cy="-10" r="6" fill="#7cc95a"/>
      <circle cx="-8" cy="-10" r="3.5" fill="#fff"/>
      <circle cx="8" cy="-10" r="3.5" fill="#fff"/>
      <circle cx="-7.5" cy="-10" r="1.8" fill="#2d3a2a"/>
      <circle cx="8.5" cy="-10" r="1.8" fill="#2d3a2a"/>
      <path d="M-6,1 Q0,6 6,1" fill="none" stroke="#2d3a2a" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-11" cy="1" r="2.5" fill="#ffb3b3"/>
      <circle cx="11" cy="1" r="2.5" fill="#ffb3b3"/>
    </g>
  </defs>

  <!-- 天空與雲 -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle cx="345" cy="50" r="26" fill="#ffe27a"/>
  <g fill="#ffffff">
    <ellipse cx="90" cy="50" rx="38" ry="16"/>
    <ellipse cx="115" cy="40" rx="24" ry="14"/>
    <ellipse cx="250" cy="70" rx="30" ry="12"/>
  </g>

  <!-- 對岸草地 -->
  <path d="M0,150 Q200,130 400,150 L400,175 L0,175 Z" fill="#9ed67d"/>

  <!-- 小河 -->
  <path d="M0,170 Q200,160 400,170 L400,245 Q200,255 0,245 Z" fill="#7ec8ee"/>
  <g fill="none" stroke="#c9ecff" stroke-width="3" stroke-linecap="round">
    <path d="M40,200 q15,-6 30,0"/>
    <path d="M300,225 q15,-6 30,0"/>
    <path d="M330,190 q12,-5 24,0"/>
  </g>

  <!-- 近岸草地 -->
  <path d="M0,240 Q200,255 400,240 L400,300 L0,300 Z" fill="#8cc96b"/>
  <g fill="#ffd84d">
    <circle cx="300" cy="275" r="5"/>
    <circle cx="330" cy="285" r="4"/>
    <circle cx="370" cy="270" r="5"/>
  </g>

  <!-- 小安：蹲在岸邊 -->
  <g transform="translate(95,232)">
    <ellipse cx="0" cy="30" rx="30" ry="8" fill="#6fae52"/>
    <path d="M-24,28 Q-26,-6 0,-8 Q26,-6 24,28 Z" fill="#5b9bd5"/>
    <path d="M14,6 Q34,0 46,-8" fill="none" stroke="#ffd9b3" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="-28" r="20" fill="#ffd9b3"/>
    <path d="M-20,-30 Q-18,-52 2,-50 Q20,-50 20,-32 Q8,-40 -20,-30 Z" fill="#4a3428"/>
    <circle cx="-7" cy="-26" r="2.2" fill="#33241c"/>
    <circle cx="7" cy="-26" r="2.2" fill="#33241c"/>
    <path d="M-6,-16 Q0,-10 6,-16" fill="none" stroke="#33241c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-13" cy="-19" r="3" fill="#ffb3a7"/>
    <circle cx="13" cy="-19" r="3" fill="#ffb3a7"/>
  </g>

  <!-- 紙船小白帆 -->
  <use href="#boat" transform="translate(230,200)"/>

  <!-- 青蛙呱呱跳過來 -->
  <path d="M330,165 Q300,130 262,150" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round"/>
  <use href="#frog" transform="translate(262,148) rotate(-12)"/>
</svg>
