<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>小女孩在黃色的月亮上高高跳起，旁邊的小白兔送她一顆發亮的月亮糖。</title>
  <defs>
    <path id="star" d="M0,-20 L5.3,-7.3 L19,-6.2 L8.6,2.8 L11.8,16.2 L0,9 L-11.8,16.2 L-8.6,2.8 L-19,-6.2 L-5.3,-7.3 Z" fill="#ffd84d" stroke="#ffd84d" stroke-width="5" stroke-linejoin="round"/>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.5" stop-color="#ffe680" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffe680" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="400" height="300" fill="#1f2b5c"/>
  <g fill="#fff6c2">
    <circle cx="150" cy="30" r="2"/>
    <circle cx="240" cy="20" r="1.5"/>
    <circle cx="300" cy="60" r="2"/>
    <circle cx="370" cy="30" r="1.5"/>
    <circle cx="40" cy="120" r="1.5"/>
    <circle cx="340" cy="120" r="2"/>
  </g>

  <!-- 停在天上的星星列車 -->
  <g transform="translate(40,45) scale(0.6)">
    <path d="M0,0 L120,10" stroke="#ffe680" stroke-width="5" stroke-linecap="round"/>
    <use href="#star" transform="scale(1.4)"/>
    <use href="#star" transform="translate(60,5)"/>
    <use href="#star" transform="translate(115,10)"/>
  </g>

  <!-- 月亮表面 -->
  <ellipse cx="200" cy="330" rx="300" ry="120" fill="#ffe27a"/>
  <g fill="#f5c94f">
    <ellipse cx="80" cy="260" rx="26" ry="9"/>
    <ellipse cx="190" cy="280" rx="18" ry="6"/>
    <ellipse cx="330" cy="275" rx="22" ry="7"/>
    <ellipse cx="260" cy="240" rx="12" ry="4"/>
  </g>

  <!-- 小晴高高跳起 -->
  <g transform="translate(140,120)">
    <path d="M-12,30 l-10,16 M12,30 l10,14" stroke="#ffd9b3" stroke-width="7" stroke-linecap="round"/>
    <path d="M-12,8 l-22,-16 M12,8 l22,-16" stroke="#ffd9b3" stroke-width="7" stroke-linecap="round"/>
    <path d="M-20,34 Q-22,6 0,4 Q22,6 20,34 Z" fill="#ff9ec7"/>
    <circle cx="-17" cy="-22" r="8" fill="#7a4a2a"/>
    <circle cx="17" cy="-22" r="8" fill="#7a4a2a"/>
    <circle cx="0" cy="-10" r="17" fill="#ffd9b3"/>
    <path d="M-17,-12 Q-15,-30 0,-29 Q15,-30 17,-12 Q8,-22 -17,-12 Z" fill="#7a4a2a"/>
    <path d="M-9,-8 Q-6,-12 -3,-8" fill="none" stroke="#3b2a1e" stroke-width="2" stroke-linecap="round"/>
    <path d="M3,-8 Q6,-12 9,-8" fill="none" stroke="#3b2a1e" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6,-1 Q0,7 6,-1 Z" fill="#c0392b"/>
    <circle cx="-11" cy="-2" r="2.8" fill="#ffaaa0"/>
    <circle cx="11" cy="-2" r="2.8" fill="#ffaaa0"/>
  </g>
  <!-- 跳躍線 -->
  <g fill="none" stroke="#fff6c2" stroke-width="2.5" stroke-linecap="round">
    <path d="M120,195 Q140,205 160,195"/>
    <path d="M128,212 Q140,218 152,212"/>
  </g>

  <!-- 小白兔與月亮糖 -->
  <g transform="translate(290,205)">
    <ellipse cx="-8" cy="-48" rx="6" ry="18" fill="#ffffff"/>
    <ellipse cx="8" cy="-48" rx="6" ry="18" fill="#ffffff"/>
    <ellipse cx="-8" cy="-46" rx="2.5" ry="12" fill="#ffc2d6"/>
    <ellipse cx="8" cy="-46" rx="2.5" ry="12" fill="#ffc2d6"/>
    <ellipse cx="0" cy="10" rx="22" ry="20" fill="#ffffff"/>
    <circle cx="0" cy="-20" r="16" fill="#ffffff"/>
    <circle cx="-6" cy="-22" r="2.2" fill="#3b2a1e"/>
    <circle cx="6" cy="-22" r="2.2" fill="#3b2a1e"/>
    <ellipse cx="0" cy="-16" rx="2.5" ry="1.8" fill="#ff8fb1"/>
    <circle cx="-10" cy="-15" r="2.5" fill="#ffc2d6"/>
    <circle cx="10" cy="-15" r="2.5" fill="#ffc2d6"/>
    <circle cx="-32" cy="2" r="18" fill="url(#glow)"/>
    <circle cx="-32" cy="2" r="7" fill="#fff3a6" stroke="#ffd84d" stroke-width="2"/>
    <path d="M-20,6 Q-26,4 -30,4" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
