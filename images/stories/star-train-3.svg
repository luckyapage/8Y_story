<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>白色的雲朵城堡旁，小女孩坐在星星列車上，伸手接住掉在樹梢的三顆小星星。</title>
  <defs>
    <path id="star" d="M0,-20 L5.3,-7.3 L19,-6.2 L8.6,2.8 L11.8,16.2 L0,9 L-11.8,16.2 L-8.6,2.8 L-19,-6.2 L-5.3,-7.3 Z" fill="#ffd84d" stroke="#ffd84d" stroke-width="5" stroke-linejoin="round"/>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b5c"/>
      <stop offset="1" stop-color="#3b3a7a"/>
    </linearGradient>
  </defs>

  <!-- 夜空 -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <g fill="#fff6c2">
    <circle cx="200" cy="25" r="2"/>
    <circle cx="260" cy="15" r="1.5"/>
    <circle cx="380" cy="120" r="1.5"/>
    <circle cx="20" cy="250" r="1.5"/>
  </g>

  <!-- 雲朵城堡 -->
  <g fill="#ffffff">
    <rect x="35" y="70" width="34" height="90" rx="14"/>
    <rect x="135" y="80" width="34" height="80" rx="14"/>
    <path d="M30,74 L52,40 L74,74 Z" fill="#c9d4ff" stroke="#c9d4ff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M130,84 L152,52 L174,84 Z" fill="#c9d4ff" stroke="#c9d4ff" stroke-width="6" stroke-linejoin="round"/>
    <rect x="60" y="110" width="85" height="70" rx="16"/>
    <circle cx="40" cy="180" r="28"/>
    <circle cx="85" cy="190" r="32"/>
    <circle cx="135" cy="188" r="30"/>
    <circle cx="175" cy="182" r="24"/>
  </g>
  <rect x="88" y="135" width="28" height="36" rx="14" fill="#c9d4ff"/>
  <circle cx="52" cy="100" r="6" fill="#ffe9a8"/>
  <circle cx="152" cy="108" r="6" fill="#ffe9a8"/>

  <!-- 雲朵公主在門口 -->
  <g transform="translate(102,150)">
    <path d="M-10,22 Q-10,4 0,4 Q10,4 10,22 Z" fill="#d7b8ff"/>
    <circle cx="0" cy="-4" r="9" fill="#ffe0c2"/>
    <path d="M-6,-12 l3,-6 l3,4 l3,-4 l3,6 Z" fill="#ffd84d"/>
    <circle cx="-3" cy="-4" r="1.3" fill="#3b2a1e"/>
    <circle cx="3" cy="-4" r="1.3" fill="#3b2a1e"/>
    <ellipse cx="0" cy="1" rx="1.8" ry="2" fill="#c0392b"/>
  </g>

  <!-- 大樹 -->
  <rect x="300" y="215" width="20" height="85" rx="6" fill="#6b4a3a"/>
  <circle cx="310" cy="205" r="42" fill="#3f8f6a"/>
  <circle cx="280" cy="225" r="26" fill="#3f8f6a"/>
  <circle cx="340" cy="225" r="26" fill="#3f8f6a"/>

  <!-- 樹梢上的小星星 -->
  <use href="#star" transform="translate(295,168) scale(0.45)"/>
  <use href="#star" transform="translate(320,160) scale(0.45)"/>
  <use href="#star" transform="translate(338,176) scale(0.45)"/>
  <g stroke="#fff6c2" stroke-width="2" stroke-linecap="round">
    <path d="M286,152 l-4,-5"/>
    <path d="M320,142 l0,-6"/>
    <path d="M350,164 l5,-4"/>
  </g>

  <!-- 星星列車往下飛 -->
  <path d="M265,105 L330,55 L385,25" stroke="#ffe680" stroke-width="4" stroke-linecap="round" fill="none"/>
  <use href="#star" transform="translate(330,55) scale(1.1)"/>
  <use href="#star" transform="translate(380,28) scale(1.1)"/>
  <g transform="translate(262,108) scale(1.7)">
    <use href="#star"/>
  </g>

  <!-- 小晴坐在車頭，伸手接星星 -->
  <g transform="translate(262,88)">
    <path d="M10,10 Q28,30 32,60" fill="none" stroke="#ffd9b3" stroke-width="7" stroke-linecap="round"/>
    <path d="M-16,30 Q-18,6 0,4 Q18,6 16,30 Z" fill="#ff9ec7"/>
    <circle cx="-15" cy="-18" r="7" fill="#7a4a2a"/>
    <circle cx="15" cy="-18" r="7" fill="#7a4a2a"/>
    <circle cx="0" cy="-8" r="15" fill="#ffd9b3"/>
    <path d="M-15,-10 Q-13,-26 0,-25 Q13,-26 15,-10 Q7,-18 -15,-10 Z" fill="#7a4a2a"/>
    <circle cx="-4" cy="-5" r="2.2" fill="#3b2a1e"/>
    <circle cx="7" cy="-5" r="2.2" fill="#3b2a1e"/>
    <path d="M-2,2 Q2,6 6,2" fill="none" stroke="#3b2a1e" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="-9" cy="0" r="2.5" fill="#ffaaa0"/>
    <circle cx="11" cy="0" r="2.5" fill="#ffaaa0"/>
  </g>
</svg>
